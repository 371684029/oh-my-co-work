name: CI

# 给所有分支/PR 一个便宜、快速的信号：跑测试 + 打包 dry-run。
# 三平台包正式提交只在 push 到 main 时由 pack-release.yml 做（见该文件顶部注释）；
# 这里只在 ubuntu-latest 上打一次 linux-x64 包做验证，不 commit，纯粹为了在合并
# 到 main 之前就抓到「代码改了但打不出可用包」的问题，而不是等合并后才发现。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test web (pure logic)
        run: npm run test:web

      - name: Test electron (pure logic)
        run: npm run test:electron

      - name: Build web (sanity)
        run: npm run build -w web

      - name: Install Playwright Chromium (E2E smoke)
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (built web + server)
        run: node scripts/ci-e2e-smoke.mjs

      - name: Cache Electron / Node runtime zips
        uses: actions/cache@v4
        with:
          path: release/cache
          key: pack-desktop-cache-v32.3.3-node20.18.3

      # 桌面包：win32/darwin 只能交叉打包没法执行，但三平台共用 embedDesktop/bundleElectronApp，
      # 在 linux 上真把 Electron 窗口拉起来，抓「主进程 import 失败 / 原生模块 ABI 不符」这类
      # 只有启动时才暴露的问题（此前漏拷 lib/*.mjs、@acw/shared 不可解析都是用户先发现的）。
      - name: Desktop pack + launch smoke (linux-x64, dry run)
        env:
          ACW_PACK_TARGET: linux-x64
          ACW_PACK_SKIP_WEB_BUILD: '1'
        run: |
          set -euo pipefail
          node scripts/pack-release.mjs --desktop
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          ZIP="release/oh-my-co-work-v${MAJOR}-linux-x64-desktop.zip"
          node scripts/verify-pack.mjs --zip "$ZIP" --platform linux-x64 --version "$VER"
          node scripts/desktop-smoke.mjs --zip "$ZIP" --port 3798

      # 合并前就抓「打不出可用包」：dry-run 打 linux-x64 包，验证结构 + 真机起服务，
      # 不 commit（本 job 的 packages/ 改动只存在于这次 runner 的临时工作区）。
      - name: Pack + smoke test (dry run, not committed)
        run: |
          set -euo pipefail
          npm run pack
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          node scripts/verify-pack.mjs \
            --zip "packages/oh-my-co-work-v${MAJOR}-linux-x64.zip" \
            --platform linux-x64 \
            --version "$VER"
          STAGE="/tmp/acw-ci-pack-smoke"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          unzip -q "packages/oh-my-co-work-v${MAJOR}-linux-x64.zip" -d "$STAGE"
          cd "$STAGE/oh-my-co-work-v${MAJOR}-linux-x64"
          ACW_PORT=3799 node start.mjs > /tmp/acw-ci-pack-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3799/api/health > /tmp/acw-ci-pack-smoke-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ ! -s /tmp/acw-ci-pack-smoke-health.json ]; then
            echo "[smoke] /api/health 未返回，日志如下：" >&2
            cat /tmp/acw-ci-pack-smoke.log >&2
            exit 1
          fi
          cat /tmp/acw-ci-pack-smoke-health.json
