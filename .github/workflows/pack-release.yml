name: Pack release zip

# 只在 push 到 main 时打三平台包：
# - 三个平台全部用 ubuntu-latest + ACW_PACK_TARGET 交叉打包（node-pty / better-sqlite3
#   靠 prebuild-install 按 npm_config_platform/arch 拉对应平台预编译产物，不需要真实
#   windows-latest / macos-latest 跑一遍）。
# - 这样只消耗 ubuntu 的 1x 分钟数，不再触发 windows-latest(2x) / macos-latest(10x)，
#   避免账号 Actions 额度被跑爆导致三平台包（尤其 windows/macos）卡在旧构建不更新。
# - 不再在每个 cursor/** 分支的每次 push 上打包；日常测试信号见 ci.yml。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win32-x64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack runtime bundle
        env:
          ACW_PACK_TARGET: ${{ matrix.target }}
        run: npm run pack

      - name: Verify packed zip
        run: |
          set -euo pipefail
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          node scripts/verify-pack.mjs \
            --zip "packages/oh-my-co-work-v${MAJOR}-${{ matrix.target }}.zip" \
            --platform "${{ matrix.target }}" \
            --version "$VER"

      # linux-x64 是唯一能在 ubuntu-latest 上真机跑起来的目标（win32/darwin 是交叉打包，
      # 二进制格式对但换不了操作系统去执行）；借这个目标顺手做端到端烟雾测试，
      # 确认打出来的包解压即用，不是只有文件格式对但实际起不来。
      - name: Smoke test packed zip (linux-x64 only)
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          STAGE="/tmp/acw-pack-smoke"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          unzip -q "packages/oh-my-co-work-v${MAJOR}-linux-x64.zip" -d "$STAGE"
          cd "$STAGE/oh-my-co-work-v${MAJOR}-linux-x64"
          ACW_PORT=3799 node start.mjs > /tmp/acw-pack-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3799/api/health > /tmp/acw-pack-smoke-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ ! -s /tmp/acw-pack-smoke-health.json ]; then
            echo "[smoke] /api/health 未返回，日志如下：" >&2
            cat /tmp/acw-pack-smoke.log >&2
            exit 1
          fi
          cat /tmp/acw-pack-smoke-health.json
          node -e "const h=require('/tmp/acw-pack-smoke-health.json'); if (!h.ok) { console.error('health ok=false'); process.exit(1); } console.log('[smoke] sqliteDriver=' + h.sqliteDriver);"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-co-work-${{ matrix.target }}
          path: |
            packages/oh-my-co-work-v*.zip
            packages/oh-my-co-work-v*.build.json
          if-no-files-found: error
          retention-days: 3

      - name: Commit packages zip to git (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          git config user.name "wll"
          git config user.email "371684029@qq.com"
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          FILE="oh-my-co-work-v${MAJOR}-${PLAT}.zip"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          PUSHED=0
          # 2026-09-01 修复：此前先 pull 后提交，脏工作树 + rebase/autostash 会把刚构建的
          # zip 冲掉而文本清单留存，导致 win32 包连续多日未真正入库、release 校验必挂。
          # 现改为：先自检 + 先把本平台 zip 提交成本地提交，再 rebase 追其它平台提交。
          # 自检：zip 内 BUILD_INFO 必须来自本次构建的提交，宁可失败也不提交旧包。
          BUILT_SHA="$(unzip -p "packages/${FILE}" '*/BUILD_INFO.json' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(String(JSON.parse(s).sourceCommit||'')))")"
          if [ "$BUILT_SHA" != "$GITHUB_SHA" ]; then
            echo "[pack] zip 内 sourceCommit=${BUILT_SHA} != 本次构建 ${GITHUB_SHA}，拒绝提交旧包" >&2
            exit 1
          fi
          node scripts/pack-release.mjs --manifest-only
          # 整目录暂存：大版本切换时 pack 会删除旧 major 的 zip/sidecar，
          # 必须把删除一并提交，否则三平台并行时 main 里新旧版本混存、validate 必挂
          git add -A packages/
          if ! git diff --staged --quiet; then
            git commit -m "chore(packages): 更新 ${FILE} (${VER})"
          fi
          # 多平台并行：rebase 若与其它平台的共享清单冲突，按磁盘上的 zip 重写清单再继续
          for i in 1 2 3 4 5 6; do
            if ! git pull --rebase origin main; then
              node scripts/pack-release.mjs --manifest-only
              git add -A packages/ || true
              GIT_EDITOR=true git rebase --continue || true
            fi
            # 清掉残留冲突标记后再提交
            if grep -R -l '<<<<<<' packages/README.md packages/CURRENT.txt 2>/dev/null; then
              node scripts/pack-release.mjs --manifest-only
            fi
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            sleep $((i * 4))
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "[pack] failed to push ${FILE} after retries" >&2
            exit 1
          fi

  release:
    needs: pack
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync packages from main
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            git pull origin main
            COUNT=$(ls -1 packages/oh-my-co-work-v*.zip 2>/dev/null | wc -l | tr -d ' ')
            echo "[release] zip count=$COUNT"
            if [ "$COUNT" -ge 3 ]; then
              break
            fi
            sleep 15
          done
          ls -la packages/*.zip

      - name: Validate three platform packages
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/validate-release-packages.mjs --expected-sha "$EXPECTED_SOURCE_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p upload
          cp -f packages/oh-my-co-work-v*.zip upload/
          ls -la upload
          SHORT=$(git rev-parse --short HEAD)
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          NOTES=$(cat <<EOF
          ## 运行包（打包产物，非源码）· v${VER}

          解压后双击 \`start.bat\` / 运行 \`./start.sh\`。
          **不需要 npm install**（依赖已打进包内；仍需本机 Node.js ≥ 18）。

          请下载与本机系统匹配的 zip：
          - \`*-win32-x64.zip\` → Windows
          - \`*-linux-x64.zip\` → Linux
          - \`*-darwin-*.zip\` → macOS

          仓库内同步目录：\`packages/\`
          提交：\`${SHORT}\`
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest upload/*.zip \
            --title "运行包（最新 · ${SHORT}）" \
            --notes "$NOTES" \
            --latest
