name: Pack release zip

# push 到 main 时打三平台轻量包 + 三平台桌面包，发布到 GitHub Release `latest`。
# - 全部在 ubuntu-latest 上用 ACW_PACK_TARGET 交叉打包（原生模块按目标平台拉预编译），
#   只消耗 1x 分钟数，不跑 windows-latest(2x) / macos-latest(10x)。
# - 产物只走 artifact → Release，**不再提交进 git**（5.7.0 PKG-04）：此前每次 push 往 main
#   推 ~72MB zip，三平台并行 rebase 推送是打包最常见的失败点，仓库也越滚越大。
# - 桌面包 matrix 与轻量包分开，单个桌面平台失败不拖死发布（Release 只是缺那一份并告警）。
# - 合并前的「能不能打出能启动的包」由 ci.yml 把关（含 linux 桌面包 xvfb 真机冒烟）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win32-x64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack runtime bundle
        env:
          ACW_PACK_TARGET: ${{ matrix.target }}
        run: npm run pack

      - name: Verify packed zip
        run: |
          set -euo pipefail
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          node scripts/verify-pack.mjs \
            --zip "packages/oh-my-co-work-v${MAJOR}-${{ matrix.target }}.zip" \
            --platform "${{ matrix.target }}" \
            --version "$VER"

      # linux-x64 是唯一能在 ubuntu-latest 上真机跑起来的目标；借它做端到端烟雾测试。
      - name: Smoke test packed zip (linux-x64 only)
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          STAGE="/tmp/acw-pack-smoke"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          unzip -q "packages/oh-my-co-work-v${MAJOR}-linux-x64.zip" -d "$STAGE"
          cd "$STAGE/oh-my-co-work-v${MAJOR}-linux-x64"
          ACW_PORT=3799 node start.mjs > /tmp/acw-pack-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3799/api/health > /tmp/acw-pack-smoke-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ ! -s /tmp/acw-pack-smoke-health.json ]; then
            echo "[smoke] /api/health 未返回，日志如下：" >&2
            cat /tmp/acw-pack-smoke.log >&2
            exit 1
          fi
          cat /tmp/acw-pack-smoke-health.json
          node -e "const h=require('/tmp/acw-pack-smoke-health.json'); if (!h.ok) { console.error('health ok=false'); process.exit(1); } console.log('[smoke] sqliteDriver=' + h.sqliteDriver);"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: oh-my-co-work-${{ matrix.target }}
          # 只传本平台（packages/ 里可能有本地/历史残留的其它平台 zip，通配会让 release
          # 合并 artifact 时同名 zip 并行覆盖写坏）
          path: |
            packages/oh-my-co-work-v*-${{ matrix.target }}.zip
            packages/oh-my-co-work-v*-${{ matrix.target }}.build.json
          if-no-files-found: error
          retention-days: 3

  pack-desktop:
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Read pinned runtime versions
        id: ver
        run: |
          echo "node=$(node -p "require('./package.json').acwPack.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "electron=$(node -p "require('./package.json').acwPack.electronVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron / Node runtime zips
        uses: actions/cache@v6
        with:
          path: release/cache
          key: pack-desktop-cache-${{ matrix.target }}-electron${{ steps.ver.outputs.electron }}-node${{ steps.ver.outputs.node }}

      - name: Pack desktop zip
        env:
          ACW_PACK_DESKTOP: '1'
          ACW_PACK_TARGET: ${{ matrix.target }}
        run: npm run pack:desktop

      - name: Verify desktop zip
        run: |
          set -euo pipefail
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          node scripts/verify-pack.mjs \
            --zip "release/oh-my-co-work-v${MAJOR}-${{ matrix.target }}-desktop.zip" \
            --platform "${{ matrix.target }}" \
            --version "$VER"

      - name: Upload desktop zip
        uses: actions/upload-artifact@v7
        with:
          name: oh-my-co-work-${{ matrix.target }}-desktop
          path: release/oh-my-co-work-v*-${{ matrix.target }}-desktop.zip
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [pack, pack-desktop]
    # 轻量包三平台必须成功；桌面包任一平台失败时降级发布并告警
    if: always() && github.ref == 'refs/heads/main' && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: oh-my-co-work-*
          path: artifacts
          merge-multiple: true

      - name: Collect zips + build.json from artifacts
        run: |
          set -euo pipefail
          rm -rf packages upload && mkdir -p packages upload
          find artifacts -maxdepth 4 -type f | sort
          for f in artifacts/oh-my-co-work-v*.zip artifacts/oh-my-co-work-v*.build.json; do
            case "$f" in *-desktop.zip) continue ;; esac
            if [ -f "$f" ]; then cp -f "$f" packages/; fi
          done
          ls -la packages/

      - name: Validate three platform packages
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/validate-release-packages.mjs --expected-sha "$EXPECTED_SOURCE_SHA"

      - name: Publish GitHub Release (update in place)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp -f packages/oh-my-co-work-v*.zip upload/
          MISSING=""
          for t in win32-x64 linux-x64 darwin-arm64; do
            if ls artifacts/oh-my-co-work-v*-"$t"-desktop.zip >/dev/null 2>&1; then
              cp -f artifacts/oh-my-co-work-v*-"$t"-desktop.zip upload/
            else
              MISSING="$MISSING $t"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::桌面包缺失:${MISSING}（对应 pack-desktop job 失败），Release 先发其余产物；可单独重跑补齐。"
          fi
          ls -la upload
          SHORT=$(git rev-parse --short HEAD)
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          NOTES="## 运行包（打包产物，非源码）· v${VER}

          **桌面窗口（推荐）**：下载对应平台的 \`*-desktop.zip\`，内含 Electron 与 Node，不用再装 Node.js。
          - Windows：解压后双击 \`start.bat\`
          - Linux：\`./start.sh\`
          - macOS（未签名便携版）：\`./start.sh\`；被 Gatekeeper 拦截时执行 \`xattr -dr com.apple.quarantine .\`

          关窗藏托盘，托盘「退出」才停服务。

          **轻量运行包**（需本机 Node.js ≥ 18，打开浏览器）：\`*-win32-x64.zip\` / \`*-linux-x64.zip\` / \`*-darwin-arm64.zip\`

          提交：\`${SHORT}\`"
          # 原地更新：不再先删后建（中间窗口期 latest 下载全部 404）
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "运行包（最新 · ${SHORT}）" --notes "$NOTES" --latest
            gh release upload latest upload/*.zip --clobber
            gh release view latest --json assets -q '.assets[].name' | while read -r a; do
              if [ -f "upload/$a" ]; then continue; fi
              keep=0
              for t in $MISSING; do
                case "$a" in *-"$t"-desktop.zip) keep=1 ;; esac
              done
              if [ "$keep" = 1 ]; then
                echo "::warning::本次 ${a} 未产出，保留 Release 里的旧版本"
                continue
              fi
              gh release delete-asset latest "$a" --yes
            done
          else
            gh release create latest upload/*.zip --title "运行包（最新 · ${SHORT}）" --notes "$NOTES" --latest
          fi
