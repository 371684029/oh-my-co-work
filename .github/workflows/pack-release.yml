name: Pack release zip

# 只在 push 到 main 时打三平台包：
# - 三个平台全部用 ubuntu-latest + ACW_PACK_TARGET 交叉打包（node-pty / better-sqlite3
#   靠 prebuild-install 按 npm_config_platform/arch 拉对应平台预编译产物，不需要真实
#   windows-latest / macos-latest 跑一遍）。
# - 这样只消耗 ubuntu 的 1x 分钟数，不再触发 windows-latest(2x) / macos-latest(10x)，
#   避免账号 Actions 额度被跑爆导致三平台包（尤其 windows/macos）卡在旧构建不更新。
# - 不再在每个 cursor/** 分支的每次 push 上打包；日常测试信号见 ci.yml。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win32-x64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack runtime bundle
        env:
          ACW_PACK_TARGET: ${{ matrix.target }}
        run: npm run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-co-work-${{ matrix.target }}
          path: |
            packages/oh-my-co-work-v*.zip
            packages/oh-my-co-work-v*.build.json
          if-no-files-found: error
          retention-days: 3

      - name: Commit packages zip to git (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          git config user.name "wll"
          git config user.email "371684029@qq.com"
          MAJOR="$(node -p "String(require('./package.json').version).split('.')[0]")"
          FILE="oh-my-co-work-v${MAJOR}-${PLAT}.zip"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          PUSHED=0
          # 多平台并行：rebase 后若 README/CURRENT 冲突，按目录内 zip 重写清单再继续
          for i in 1 2 3 4 5 6; do
            if ! git pull --rebase origin main; then
              if [ -f packages/README.md ] && grep -q '<<<<<<' packages/README.md packages/CURRENT.txt 2>/dev/null; then
                git checkout --ours packages/README.md packages/CURRENT.txt || true
                git checkout --theirs packages/README.md packages/CURRENT.txt || true
                # 保留所有已跟踪 zip，按磁盘内容重写清单
                git checkout --ours -- 'packages/*.zip' 2>/dev/null || true
                git checkout HEAD -- 'packages/*.zip' 2>/dev/null || true
                node scripts/pack-release.mjs --manifest-only
                git add packages/README.md packages/CURRENT.txt packages/*.zip || true
                GIT_EDITOR=true git rebase --continue || true
              else
                git rebase --abort || true
                git pull --rebase --autostash origin main || true
              fi
            fi
            # 清掉残留冲突标记后再提交
            if grep -R -l '<<<<<<' packages/README.md packages/CURRENT.txt 2>/dev/null; then
              node scripts/pack-release.mjs --manifest-only
            fi
            git add packages/
            if ! git diff --staged --quiet; then
              git commit -m "chore(packages): 更新 ${FILE} (${VER})" || true
            else
              echo "[pack] no new staged package changes"
            fi
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            sleep $((i * 4))
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "[pack] failed to push ${FILE} after retries" >&2
            exit 1
          fi

  release:
    needs: pack
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync packages from main
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            git pull origin main
            COUNT=$(ls -1 packages/oh-my-co-work-v*.zip 2>/dev/null | wc -l | tr -d ' ')
            echo "[release] zip count=$COUNT"
            if [ "$COUNT" -ge 3 ]; then
              break
            fi
            sleep 15
          done
          ls -la packages/*.zip

      - name: Validate three platform packages
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/validate-release-packages.mjs --expected-sha "$EXPECTED_SOURCE_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p upload
          cp -f packages/oh-my-co-work-v*.zip upload/
          ls -la upload
          SHORT=$(git rev-parse --short HEAD)
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          NOTES=$(cat <<EOF
          ## 运行包（打包产物，非源码）· v${VER}

          解压后双击 \`start.bat\` / 运行 \`./start.sh\`。
          **不需要 npm install**（依赖已打进包内；仍需本机 Node.js ≥ 18）。

          请下载与本机系统匹配的 zip：
          - \`*-win32-x64.zip\` → Windows
          - \`*-linux-x64.zip\` → Linux
          - \`*-darwin-*.zip\` → macOS

          仓库内同步目录：\`packages/\`
          提交：\`${SHORT}\`
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest upload/*.zip \
            --title "运行包（最新 · ${SHORT}）" \
            --notes "$NOTES" \
            --latest
