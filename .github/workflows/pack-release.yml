name: Pack release zip

on:
  push:
    branches: [main, 'cursor/**']
    # 避免「CI 回写 packages/」再次触发打包死循环
    paths-ignore:
      - 'packages/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 回写 packages 需要可推送
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack
        id: pack
        run: npm run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-co-work-release
          path: |
            release/*.zip
            release/*.tar.gz
            packages/apple-co-work-v*.zip
          if-no-files-found: error
          retention-days: 14

      # 推 main：把 packages/ 大版本 zip 提交进仓库（小版本覆盖、大版本增量）
      - name: Commit packages zip to git (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "wll"
          git config user.email "371684029@qq.com"
          git add packages/
          if git diff --staged --quiet; then
            echo "[pack] packages/ unchanged, skip commit"
          else
            MAJOR=$(sed -n 's/^major=//p' packages/CURRENT.txt | head -n1)
            VER=$(sed -n 's/^version=//p' packages/CURRENT.txt | head -n1)
            git commit -m "chore(packages): 更新 apple-co-work-v${MAJOR}.zip (${VER})"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP=$(ls -1 packages/apple-co-work-v*.zip | sort -V | tail -n1)
          NAME=$(basename "$ZIP")
          SHORT=$(git rev-parse --short HEAD)
          VER=$(sed -n 's/^version=//p' packages/CURRENT.txt | head -n1 || true)
          NOTES=$(cat <<EOF
          ## 本机压缩包（亦提交在仓库 packages/）

          仓库内路径：\`packages/${NAME}\`
          直链：https://github.com/${{ github.repository }}/raw/main/packages/${NAME}

          解压后双击 \`start.bat\`（Windows）或运行 \`./start.sh\` / \`node start.mjs\`。

          - 需要本机 Node.js ≥ 18
          - 关闭浏览器后，后台默认自动退出
          - **小版本**：覆盖同大版本 zip；**大版本**：新增 vN.zip，旧包保留

          版本：\`${VER:-?}\` · 提交：\`${SHORT}\`
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest "$ZIP" \
            --title "下载压缩包（最新 · ${SHORT}）" \
            --notes "$NOTES" \
            --latest
          echo "Repo file: packages/${NAME}"
          echo "Raw: https://github.com/${{ github.repository }}/raw/main/packages/${NAME}"
