name: Pack release zip

on:
  push:
    branches: [main, 'cursor/**']
    paths-ignore:
      - 'packages/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack runtime bundle
        run: npm run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-co-work-${{ matrix.os }}
          path: |
            release/*.zip
            packages/apple-co-work-v*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit packages zip to git (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "wll"
          git config user.email "371684029@qq.com"
          PLAT="$(node -p "process.platform+'-'+process.arch")"
          FILE="apple-co-work-v1-${PLAT}.zip"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('server/config/about.json','utf8')).version")"
          # 多平台并行：rebase 后若 README/CURRENT 冲突，按目录内 zip 重写清单再继续
          for i in 1 2 3 4 5 6; do
            if ! git pull --rebase origin main; then
              if [ -f packages/README.md ] && grep -q '<<<<<<' packages/README.md packages/CURRENT.txt 2>/dev/null; then
                git checkout --ours packages/README.md packages/CURRENT.txt || true
                git checkout --theirs packages/README.md packages/CURRENT.txt || true
                # 保留所有已跟踪 zip，按磁盘内容重写清单
                git checkout --ours -- 'packages/*.zip' 2>/dev/null || true
                git checkout HEAD -- 'packages/*.zip' 2>/dev/null || true
                node scripts/pack-release.mjs --manifest-only
                git add packages/README.md packages/CURRENT.txt packages/*.zip || true
                GIT_EDITOR=true git rebase --continue || true
              else
                git rebase --abort || true
                git pull --rebase --autostash origin main || true
              fi
            fi
            # 清掉残留冲突标记后再提交
            if grep -R -l '<<<<<<' packages/README.md packages/CURRENT.txt 2>/dev/null; then
              node scripts/pack-release.mjs --manifest-only
            fi
            git add packages/
            if git diff --staged --quiet; then
              echo "[pack] packages/ unchanged"
              break
            fi
            if git commit -m "chore(packages): 更新 ${FILE} (${VER})"; then
              if git push origin HEAD:main; then
                break
              fi
            fi
            sleep $((i * 4))
          done

  release:
    needs: pack
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all pack artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -name 'apple-co-work-v*.zip' -exec cp -f {} upload/ \;
          ls -la upload
          SHORT=$(git rev-parse --short HEAD)
          NOTES=$(cat <<EOF
          ## 运行包（打包产物，非源码）

          解压后双击 \`start.bat\` / 运行 \`./start.sh\`。
          **不需要 npm install**（依赖已打进包内；仍需本机 Node.js ≥ 18）。

          请下载与本机系统匹配的 zip：
          - \`*-win32-x64.zip\` → Windows
          - \`*-linux-x64.zip\` → Linux
          - \`*-darwin-*.zip\` → macOS

          仓库内同步目录：\`packages/\`
          提交：\`${SHORT}\`
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest upload/*.zip \
            --title "运行包（最新 · ${SHORT}）" \
            --notes "$NOTES" \
            --latest
